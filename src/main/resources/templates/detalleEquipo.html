<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Detalle de equipo')"></head>

<body>
<div th:replace="fragments :: navbar(${usuarioLogeado}, ${nombreUsuario})"></div>

<div class="container-fluid mt-3">
  <h2 th:text="'Equipo: ' + ${equipo.nombre}"></h2>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>Id</th>
      <th>Nombre</th>
      <th>Email</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="usuario : ${usuarios}">
      <td th:text="${usuario.id}"></td>
      <td th:text="${usuario.nombre}"></td>
      <td th:text="${usuario.email}"></td>
    </tr>
    </tbody>
  </table>

  <p><a class="btn btn-primary" th:href="@{/equipos}">Volver al listado</a></p>
</div>

<div th:replace="fragments::javascript"></div>
</body>
</html>
