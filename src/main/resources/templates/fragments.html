<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head (titulo)">
    <meta charset="UTF-8"/>
    <title th:text="${titulo}"></title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<div th:fragment="javascript">
    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
</div>

<nav th:fragment="navbar(usuarioLogeado, nombreUsuario)" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" th:href="@{/about}">ToDoList</a>

    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarMain"
            aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMain">
        <!-- Usuario logeado -->
        <ul class="navbar-nav mr-auto" th:if="${usuarioLogeado != null}">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/usuarios/{id}/tareas(id=${usuarioLogeado})}">Tareas</a>
            </li>
        </ul>

        <ul class="navbar-nav ml-auto" th:if="${usuarioLogeado != null}">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="menuUsuario" role="button"
                   data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
                   th:text="${nombreUsuario}">
                    Usuario
                </a>
                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="menuUsuario">
                    <a class="dropdown-item" href="#">Cuenta</a>
                    <a class="dropdown-item" th:href="@{/logout}"
                       th:text="'Cerrar sesión ' + ${nombreUsuario}">Cerrar sesión</a>
                </div>
            </li>
        </ul>

        <!-- Usuario NO logeado (para /about) -->
        <ul class="navbar-nav ml-auto" th:if="${usuarioLogeado == null}">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/login}">Login</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/registro}">Registro</a>
            </li>
        </ul>
    </div>
</nav>

</html>
